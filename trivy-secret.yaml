allow-rules:
  - id: local-dev-jwt
    description: JWT de baja entropía exclusivo del perfil Spring local
    regex: local-dev-only-not-a-production-secret-32b

  - id: retired-dev-jwt
    description: JWT de desarrollo retirado del perfil por defecto; puede seguir en commits antiguos
    regex: rycapp-dev-jwt-secret-key-min-32-chars-change-in-prod-2026!!

  - id: local-example-file
    description: Plantilla con marcadores, no secretos reales
    path: (?i)application-local\.example\.yml

  - id: fixture-passwords
    description: Contraseñas ficticias de e2e, k6 y del perfil local
    regex: (Admin1234!|Conductor1234!)
