project:
  name: RYCApp
  full_name: "PG2_RYCApp / RYCApp / R&C Transportes"

paths:
  ai_brain: ../../ai-brain
  output: ./output

analysis:
  enabled: true
  score_floor: 40

generators:
  drawio: true
  mermaid: true
  plantuml: true
  c4: true
  visualization_engine: true

diagram_types:
  - architecture
  - domain
  - database
  - components
  - dependencies
  - sequence
  - c4

styles:
  drawio:
    font_family: Helvetica
    entity_fill: "#dae8fc"
    entity_stroke: "#6c8ebf"
    module_fill: "#d5e8d4"
    module_stroke: "#82b366"
    integration_fill: "#ffe6cc"
    integration_stroke: "#d79b00"
    container_fill: "#f5f5f5"
    container_stroke: "#666666"
    edge_color: "#6c8ebf"
  mermaid:
    theme: default
  plantuml:
    skinparam: true

logging:
  level: INFO
