# Compila backend + frontend y despliega con CDK (OIDC, sin llaves SSH).
# Antes corre el workflow Validar (CVE, estático, Playwright).
#
# Secrets:
#   AWS_DEPLOY_ROLE_ARN  — rol IAM con trust a GitHub OIDC
#   AWS_REGION           — opcional; por defecto us-east-1

name: Deploy AWS (CDK)

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: deploy-aws-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  security-events: write
  actions: read
  pull-requests: read

jobs:
  validate:
    name: Validar
    uses: ./.github/workflows/validate.yml
    secrets: inherit

  deploy:
    name: Desplegar
    needs: validate
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comprobar secret de AWS
        env:
          ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "Falta el secret AWS_DEPLOY_ROLE_ARN en el repositorio."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build backend JAR
        run: mvn -B -f backend/pom.xml package -DskipTests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            infra/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ''
        run: |
          npm ci
          npm run build

      - name: Install CDK
        working-directory: infra
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK deploy
        working-directory: infra
        run: npx cdk deploy --all --require-approval never
