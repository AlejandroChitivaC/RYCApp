# Push a master/main: dos checks en el commit.
# 1. Validacion CVEs y código estático
# 2. Despliegue AWS, solo si el primero terminó bien.
#
# Secrets:
#   AWS_DEPLOY_ROLE_ARN  — rol IAM con trust a GitHub OIDC
#   AWS_REGION           — opcional; por defecto us-east-1

name: CI

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  actions: read
  pull-requests: read

jobs:
  validar:
    name: Validacion CVEs y código estático
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — lint y typecheck
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npx tsc -b --pretty false

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Backend — compilar y tests unitarios
        run: mvn -B -f backend/pom.xml test -Dtest='!*IT'

      - name: Escanear CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          output: trivy-report.txt

      - name: Informe Trivy
        if: always()
        run: |
          {
            echo '## Trivy — CVEs CRITICAL'
            echo
            if [ -s trivy-report.txt ]; then
              echo '```'
              cat trivy-report.txt
              echo '```'
            else
              echo 'Trivy no generó salida.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: npm audit frontend
        working-directory: frontend
        run: npm audit --audit-level=critical

      - name: npm audit infra
        working-directory: infra
        run: npm audit --audit-level=critical

      - name: Playwright — instalar navegador
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Playwright — build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ''
        run: npm run build

      - name: Playwright — tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Informe Playwright
        if: always()
        working-directory: frontend
        run: node e2e/write-gh-summary.mjs playwright-results.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - uses: grafana/setup-k6-action@v1

      - name: Carga 10 TPS
        env:
          BASE_URL: ${{ vars.LOADTEST_BASE_URL || 'https://dne4r7yuqm0az.cloudfront.net' }}
        run: k6 run perf/login-10tps.js

      - name: Informe de carga
        if: always()
        run: |
          if [ -f k6-summary.md ]; then
            cat k6-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Carga 10 TPS' >> "$GITHUB_STEP_SUMMARY"
            echo 'k6 no escribió el resumen.' >> "$GITHUB_STEP_SUMMARY"
          fi

  desplegar:
    name: Despliegue AWS
    needs: validar
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comprobar secret de AWS
        env:
          ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "Falta el secret AWS_DEPLOY_ROLE_ARN en el repositorio."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build backend JAR
        run: mvn -B -f backend/pom.xml package -DskipTests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            infra/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ''
        run: |
          npm ci
          npm run build

      - name: Install CDK
        working-directory: infra
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK deploy
        working-directory: infra
        run: npx cdk deploy --all --require-approval never
