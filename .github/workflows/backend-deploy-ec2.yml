# Despliega el JAR del backend a EC2 cuando cambia backend/ o este workflow.
#
# Secrets en GitHub → Settings → Secrets and variables → Actions:
#   EC2_HOST              — IP o hostname (ej. tu DuckDNS)
#   EC2_USER              — usuario SSH (ej. ubuntu, ec2-user)
#   EC2_SSH_PRIVATE_KEY   — clave privada PEM completa (la pública va en ~/.ssh/authorized_keys en la EC2)
#   EC2_DEPLOY_PATH       — directorio remoto donde vive el JAR (ej. /home/ubuntu/rycapp)
#   EC2_SYSTEMD_SERVICE   — nombre del unit de systemd SIN .service (ej. rycapp)
#
# En la EC2: un servicio systemd cuyo ExecStart apunte al JAR en EC2_DEPLOY_PATH
# (o al symlink que copies tras el deploy).

name: Backend — build y deploy a EC2

on:
  push:
    branches: [master, main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy-ec2.yml'
  workflow_dispatch:

concurrency:
  group: backend-deploy-ec2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build JAR
        run: mvn -B -f backend/pom.xml package -DskipTests

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          source: 'backend/target/*.jar'
          target: ${{ secrets.EC2_DEPLOY_PATH }}
          strip_components: 2
          overwrite: true

      - name: Restart service on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            sudo systemctl restart ${{ secrets.EC2_SYSTEMD_SERVICE }}
