# CD: un solo despliegue del monorepo a AWS.
# Espera a que el workflow CI termine en éxito en master o main
# y vuelve a exigir compuerta.json de esa misma corrida.
# workflow_dispatch reutiliza la compuerta de una corrida de CI ya hecha
# (por ejemplo si la prueba de carga contra el sitio viejo impidió el éxito).
#
# Secrets:
#   AWS_DEPLOY_ROLE_ARN
#   AWS_REGION — opcional; por defecto us-east-1

name: CD

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: ID de la corrida de CI cuya compuerta se reutiliza
        required: true
        type: string
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master, main]

concurrency:
  group: cd-aws
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  desplegar:
    name: Despliegue AWS
    if: |
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
       (github.event.workflow_run.head_branch == 'master' || github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
    steps:
      - name: Checkout del commit que pasó el CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - name: Descargar compuerta de esa corrida de CI
        uses: actions/download-artifact@v8
        with:
          name: informes-seguridad
          path: security-reports
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.ci_run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Exigir compuerta abierta
        run: node .github/scripts/verificar-compuerta-despliegue.mjs security-reports/compuerta.json

      - name: Comprobar secret de AWS
        env:
          ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "Falta el secret AWS_DEPLOY_ROLE_ARN en el repositorio."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build backend JAR
        run: mvn -B -f backend/pom.xml package -DskipTests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            infra/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ''
        run: |
          npm ci
          npm run build

      - name: Install CDK
        working-directory: infra
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK deploy
        working-directory: infra
        run: npx cdk deploy --all --require-approval never

      - uses: grafana/setup-k6-action@v1

      - name: Carga 10 TPS
        env:
          BASE_URL: ${{ vars.LOADTEST_BASE_URL || 'https://dne4r7yuqm0az.cloudfront.net' }}
        run: k6 run perf/login-10tps.js

      - name: Informe de carga
        if: always()
        run: |
          if [ -f k6-summary.md ]; then
            cat k6-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Carga 10 TPS' >> "$GITHUB_STEP_SUMMARY"
            echo 'k6 no escribió el resumen.' >> "$GITHUB_STEP_SUMMARY"
          fi
