# Pull requests: un solo check. Los pasos viven dentro del job.
# El push a master/main lo cubre deploy.yml (validación + despliegue).

name: CI

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  validar:
    name: Validacion CVEs y código estático
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/validar
