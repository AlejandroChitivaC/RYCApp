# CVEs, análisis estático y Playwright.
# En master/main: corre en el push; si pasa, deploy.yml se dispara después.
# En PRs: corre solo. También se puede llamar desde un Deploy manual.

name: Validar

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: read

jobs:
  static-frontend:
    name: Estático frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar, lint y typecheck
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npx tsc -b --pretty false

  static-backend:
    name: Estático backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Compilar y tests unitarios
        run: mvn -B -f backend/pom.xml test -Dtest='!*IT'

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin, javascript-typescript
      - name: Compilar backend para CodeQL
        run: mvn -B -f backend/pom.xml -DskipTests compile
      - uses: github/codeql-action/analyze@v3

  cve:
    name: CVEs (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Escanear dependencias
        uses: aquasecurity/trivy-action@0.32.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - name: npm audit frontend
        working-directory: frontend
        run: npm audit --audit-level=critical
      - name: npm audit infra
        working-directory: infra
        run: npm audit --audit-level=critical

  dependency-review:
    name: Dependencias del PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          VITE_API_BASE_URL: ''
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
