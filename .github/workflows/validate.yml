# Pull requests: un solo check. En master el push lo cubre deploy.yml.

name: CI

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  validar:
    name: Validacion CVEs y código estático
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — lint y typecheck
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npx tsc -b --pretty false

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Backend — compilar y tests unitarios
        run: mvn -B -f backend/pom.xml test -Dtest='!*IT'

      - name: Escanear CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          format: json
          output: trivy-report.json

      - name: Informe de CVEs
        run: node .github/scripts/informe-trivy.mjs trivy-report.json

      - name: npm audit frontend
        working-directory: frontend
        run: npm audit --audit-level=critical

      - name: npm audit infra
        working-directory: infra
        run: npm audit --audit-level=critical

      - name: Dependencias del PR
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical

      - name: Playwright — instalar navegador
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Playwright — build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ''
        run: npm run build

      - name: Playwright — tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Informe Playwright
        if: always()
        working-directory: frontend
        run: node e2e/write-gh-summary.mjs playwright-results.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - uses: grafana/setup-k6-action@v1

      - name: Carga 10 TPS
        env:
          BASE_URL: ${{ vars.LOADTEST_BASE_URL || 'https://dne4r7yuqm0az.cloudfront.net' }}
        run: k6 run perf/login-10tps.js

      - name: Informe de carga
        if: always()
        run: |
          if [ -f k6-summary.md ]; then
            cat k6-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Carga 10 TPS' >> "$GITHUB_STEP_SUMMARY"
            echo 'k6 no escribió el resumen.' >> "$GITHUB_STEP_SUMMARY"
          fi
