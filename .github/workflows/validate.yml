# CVEs, análisis estático, Playwright y carga 10 TPS.
# Los informes se ven en el Summary del run (sin descargar archivos).
# En master/main: corre en el push; si pasa, deploy.yml se dispara después.

name: Validar

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  static-frontend:
    name: Estático frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar, lint y typecheck
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npx tsc -b --pretty false

  static-backend:
    name: Estático backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Compilar y tests unitarios
        run: mvn -B -f backend/pom.xml test -Dtest='!*IT'

  cve:
    name: CVEs (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Escanear dependencias
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          output: trivy-report.txt
      - name: Informe en este run
        if: always()
        run: |
          {
            echo '## Trivy — CVEs CRITICAL'
            echo
            if [ -s trivy-report.txt ]; then
              echo '```'
              cat trivy-report.txt
              echo '```'
            else
              echo 'Trivy no generó salida.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: npm audit frontend
        working-directory: frontend
        run: npm audit --audit-level=critical
      - name: npm audit infra
        working-directory: infra
        run: npm audit --audit-level=critical

  dependency-review:
    name: Dependencias del PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          VITE_API_BASE_URL: ''
      - run: npm run test:e2e
      - name: Informe en este run
        if: always()
        run: node e2e/write-gh-summary.mjs playwright-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  load:
    name: Carga 10 TPS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - name: Login a 10 TPS durante 30s
        env:
          BASE_URL: ${{ vars.LOADTEST_BASE_URL || 'https://dne4r7yuqm0az.cloudfront.net' }}
        run: k6 run perf/login-10tps.js
      - name: Informe en este run
        if: always()
        run: |
          if [ -f k6-summary.md ]; then
            cat k6-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Carga 10 TPS' >> "$GITHUB_STEP_SUMMARY"
            echo 'k6 no escribió el resumen.' >> "$GITHUB_STEP_SUMMARY"
          fi
