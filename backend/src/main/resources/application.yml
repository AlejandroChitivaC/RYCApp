server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: rycapp-backend
  config:
    import: optional:aws-secretsmanager:rycapp/backend
  servlet:
    multipart:
      max-file-size: 4MB
      max-request-size: 5MB
  output:
    ansi:
      enabled: always

logging:
  level:
    root: INFO
    com.rycapp: INFO
    com.rycapp.infrastructure.siigo: INFO
    org.springframework.web: WARN

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,https://*.cloudfront.net}
  jwt:
    secret: ${APP_JWT_SECRET:rycapp-dev-jwt-secret-key-min-32-chars-change-in-prod-2026!!}
    expiration-minutes: 720
  auth:
    otp-length: 6
    otp-expiration-minutes: 2
  mail:
    from: "noreply@rycapp.local"
  origin-verify:
    secret: ${APP_ORIGIN_VERIFY_SECRET:}
  bootstrap:
    admin:
      enabled: ${APP_BOOTSTRAP_ADMIN_ENABLED:false}
      email: ${APP_BOOTSTRAP_ADMIN_EMAIL:admin@rycapp.local}
      password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
  siigo:
    base-url: https://api.siigo.com
    username: ${SIIGO_USERNAME:}
    access-key: ${SIIGO_ACCESS_KEY:}
    partner-id: ${SIIGO_PARTNER_ID:RYCApp}
    connect-timeout-ms: 10000
    read-timeout-ms: 30000
    sync-enabled: false

aws:
  region: ${AWS_REGION:us-east-1}
  dynamodb:
    endpoint: ${DYNAMODB_ENDPOINT:}
  s3:
    endpoint: ${S3_ENDPOINT:}

rycapp:
  tables:
    usuarios: ${TABLE_USUARIOS:Usuarios}
    roles: ${TABLE_ROLES:Roles}
    lineasNegocio: ${TABLE_LINEAS_NEGOCIO:LineasNegocio}
    materiales: ${TABLE_MATERIALES:Materiales}
    tiposCosto: ${TABLE_TIPOS_COSTO:TiposCosto}
    proveedores: ${TABLE_PROVEEDORES:Proveedores}
    vehiculos: ${TABLE_VEHICULOS:Vehiculos}
    operaciones: ${TABLE_OPERACIONES:Operaciones}
    costos: ${TABLE_COSTOS:Costos}
    tickets: ${TABLE_TICKETS:Tickets}
    ticketAuditoria: ${TABLE_TICKET_AUDITORIA:TicketAuditoria}
    facturasSiigo: ${TABLE_FACTURAS_SIIGO:FacturasSiigo}
  tickets-bucket: ${TICKETS_BUCKET:rycapp-tickets-local}
  create-local-tables: ${RYCAPP_CREATE_LOCAL_TABLES:false}

---
spring:
  config:
    activate:
      on-profile: local

aws:
  dynamodb:
    endpoint: ${DYNAMODB_ENDPOINT:http://localhost:8000}

app:
  bootstrap:
    admin:
      enabled: true
      email: admin@rycapp.local
      password: Admin1234!

rycapp:
  create-local-tables: true
