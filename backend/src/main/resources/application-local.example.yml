# Copia este archivo como application-local.yml y rellena los valores.
# application-local.yml está ignorado por Git.
#
# Arranque con correo:
#   mvn spring-boot:run -Dspring-boot.run.profiles=local
#
# Requiere DynamoDB Local: docker compose up -d
#
# Brevo — si el log dice "Authentication failed":
#   1) https://app.brevo.com/settings/keys/smtp
#   2) spring.mail.username = «Iniciar sesión» en SMTP.
#   3) spring.mail.password = clave SMTP (xsmtpsib-...).
#   4) app.mail.from debe ser un remitente verificado en Brevo.

spring:
  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: TU_LOGIN_SMTP_BREVO
    password: TU_CLAVE_SMTP_BREVO
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.ssl.checkserveridentity: false
      mail.smtp.ssl.trust: smtp-relay.brevo.com

app:
  mail:
    from: "Nombre visible <remitente@verificado.com>"
  bootstrap:
    admin:
      enabled: true
      email: admin@rycapp.local
      password: Admin1234!
  siigo:
    username: ""
    access-key: ""
    partner-id: RYCApp
